name: Update availability from Hospitable

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch: {}       # allows a manual run via the "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch calendar
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
        run: python scripts/update_availability.py
      - name: Save if changed
        run: |
          if [ -n "$(git status --porcelain booking/availability.json)" ]; then
            git config user.name "availability-bot"
            git config user.email "actions@users.noreply.github.com"
            git add booking/availability.json
            git commit -m "Update availability"
            git push
          fi
